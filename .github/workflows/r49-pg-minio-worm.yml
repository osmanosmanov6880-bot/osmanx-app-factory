name: R4.9 live MinIO WORM plus independent witness on PostgreSQL 15 16
on:
  push:
    branches: ['feat/r49-independent-dr-operations', main]
    paths: ['src/migration/**', 'ops/r49/**', 'scripts/r41_pg_workflows_e2e.mjs', 'tests/r49_*.test.mjs', 'package.json', '.github/workflows/r49-pg-minio-worm.yml']
  pull_request:
    paths: ['src/migration/**', 'ops/r49/**', 'scripts/r41_pg_workflows_e2e.mjs', 'tests/r49_*.test.mjs', 'package.json', '.github/workflows/r49-pg-minio-worm.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r49-minio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  minio-worm-dr:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r49-ci-synthetic-only
          POSTGRES_DB: ox_test_factory_r40
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ox_test_factory_r40"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: r49-ci-synthetic-only
      PGDATABASE: ox_test_factory_r40
      PGSSLMODE: disable
      OX_R40_EPHEMERAL: 'YES'
      OX_R43_E2E: 'YES'
      OX_R44_E2E: 'YES'
      OX_R45_E2E: 'YES'
      OX_R46_E2E: 'YES'
      OX_R47_E2E: 'YES'
      OX_R48_E2E: 'YES'
      OX_R49_E2E: 'YES'
      OX_R49_S3_ENDPOINT: 'http://127.0.0.1:9000/'
      OX_R49_S3_BUCKET: 'r49-synthetic-worm'
      OX_R49_S3_REGION: 'us-east-1'
      OX_R49_S3_ACCESS_KEY: 'R49CIACCESS01'
      OX_R49_S3_SECRET_KEY: 'R49_SYNTHETIC_ONLY_NO_REAL_CREDENTIALS_2026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and PostgreSQL client
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
      - name: Start actual S3-compatible MinIO instance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r49-minio-data"
          docker run -d --name r49-minio-ci -p 9000:9000 \
            -e MINIO_ROOT_USER="$OX_R49_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OX_R49_S3_SECRET_KEY" \
            -v "$RUNNER_TEMP/r49-minio-data:/data" \
            quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z server /data --address :9000
          for attempt in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:9000/minio/health/live
      - name: Create a versioned, COMPLIANCE-locked synthetic bucket
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --entrypoint /bin/sh \
            -e MINIO_ROOT_USER="$OX_R49_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OX_R49_S3_SECRET_KEY" \
            quay.io/minio/mc:latest -ec '
              mc alias set r49 http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --with-lock r49/r49-synthetic-worm
              mc retention set --default COMPLIANCE 7d r49/r49-synthetic-worm
              mc retention info r49/r49-synthetic-worm
              mc version info r49/r49-synthetic-worm
            '
      - name: Security, S3, witness and ancestor regression tests
        run: |
          npm run test:r49
          npm run test:r48
          npm run test:r47
          npm run test:r46
          npm run test:r45
          npm run test:r44
          npm run test:r43
          npm run test:r42
          npm run test:r41
          npm run test:r40
          node --check scripts/r41_pg_workflows_e2e.mjs
          node --check ops/r49/recover.mjs
      - name: Signed PG CRM, actual COMPLIANCE delete denial, witness and offline restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/r41_pg_workflows_e2e.mjs --confirm-synthetic | tee artifacts/r49-pg-${{ matrix.postgres }}.json
      - name: Upload synthetic-only acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r49-minio-pg-${{ matrix.postgres }}
          path: artifacts/r49-pg-${{ matrix.postgres }}.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop disposable MinIO server
        if: always()
        run: docker rm -f r49-minio-ci || true
