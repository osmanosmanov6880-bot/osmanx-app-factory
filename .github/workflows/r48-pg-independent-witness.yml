name: R4.8 PostgreSQL 15 16 independent witness and recovery gates
on:
  push:
    branches: ['feat/r48-offsite-witness-alerts', main]
    paths:
      - 'src/migration/**'
      - 'server.mjs'
      - 'scripts/r41_pg_workflows_e2e.mjs'
      - 'tests/r48_*.test.mjs'
      - 'package.json'
      - '.github/workflows/r48-pg-independent-witness.yml'
  pull_request:
    paths:
      - 'src/migration/**'
      - 'server.mjs'
      - 'scripts/r41_pg_workflows_e2e.mjs'
      - 'tests/r48_*.test.mjs'
      - 'package.json'
      - '.github/workflows/r48-pg-independent-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r48-witness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-independent-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15','16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r48-ci-synthetic-only
          POSTGRES_DB: ox_test_factory_r40
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ox_test_factory_r40"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: r48-ci-synthetic-only
      PGDATABASE: ox_test_factory_r40
      PGSSLMODE: disable
      OX_R40_EPHEMERAL: 'YES'
      OX_R43_E2E: 'YES'
      OX_R44_E2E: 'YES'
      OX_R45_E2E: 'YES'
      OX_R46_E2E: 'YES'
      OX_R47_E2E: 'YES'
      OX_R48_E2E: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PostgreSQL client
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify isolated PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
      - name: S3 signing, independent witness, alert outbox and ancestor regression suites
        run: |
          npm run test:r48
          npm run test:r47
          npm run test:r46
          npm run test:r45
          npm run test:r44
          npm run test:r43
          npm run test:r42
          npm run test:r41
          npm run test:r40
          node --check server.mjs
          node --check scripts/r41_pg_workflows_e2e.mjs
          node --check src/migration/r48-http.mjs
      - name: Signed PG CRM, witness replay attack, privacy-safe alerts and timed restore
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/r41_pg_workflows_e2e.mjs --confirm-synthetic | tee artifacts/r48-pg-${{ matrix.postgres }}.json
      - name: Save synthetic receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r48-pg-${{ matrix.postgres }}-synthetic
          path: artifacts/r48-pg-${{ matrix.postgres }}.json
          retention-days: 7
          if-no-files-found: ignore
